<!-- Βιβλιοθήκη Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        // Δραματικό εφέ: "Fireworks Cannons" διάρκειας 5 δευτερολέπτων
        const duration = 5 * 1000;
        const animationEnd = Date.now() + duration;

        // Χρώματα που ταιριάζουν με το site (Χρυσό, Φούξια, Ροζ, Μωβ)
        const customColors = ['#ffe66d', '#ff758c', '#aa076b', '#ffffff', '#f77f00'];

        const frame = () => {
            // Κανόνι από αριστερά
            confetti({
                particleCount: 5,
                angle: 60,
                spread: 75,
                origin: { x: 0, y: 0.8 },
                colors: customColors,
                startVelocity: 65,
                scalar: 1.2
            });

            // Κανόνι από δεξιά
            confetti({
                particleCount: 5,
                angle: 120,
                spread: 75,
                origin: { x: 1, y: 0.8 },
                colors: customColors,
                startVelocity: 65,
                scalar: 1.2
            });

            if (Date.now() < animationEnd) {
                requestAnimationFrame(frame);
            }
        };

        // Εκκίνηση με το που φορτώσει η σελίδα
        window.addEventListener('load', () => {
            // Μια πρώτη τεράστια κεντρική έκρηξη
            confetti({
                particleCount: 120,
                spread: 100,
                origin: { y: 0.6 },
                colors: customColors
            });
            
            // Και άμεση έναρξη του συνεχόμενου βροχοστρόβιλου
            frame();
        });
    </script>
</body>
</html>
